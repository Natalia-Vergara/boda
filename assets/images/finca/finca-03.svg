<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="El salón de la finca iluminado de noche">
  <!-- Placeholder: reemplazar por foto real de @fincalajosefinaeventos -->
  <defs>
    <linearGradient id="noche" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F0710"/>
      <stop offset="1" stop-color="#4A0F1E"/>
    </linearGradient>
    <radialGradient id="calido" cx="0.5" cy="0.55" r="0.7">
      <stop offset="0" stop-color="#F2D8A7"/>
      <stop offset="1" stop-color="#B9905F" stop-opacity="0.15"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#noche)"/>
  <!-- Estrellas -->
  <g fill="#F2D8A7">
    <circle cx="90" cy="70" r="2"/><circle cx="200" cy="40" r="1.5"/><circle cx="320" cy="90" r="1.8"/>
    <circle cx="500" cy="50" r="1.5"/><circle cx="640" cy="85" r="2"/><circle cx="730" cy="45" r="1.4"/>
    <circle cx="420" cy="30" r="1.2"/><circle cx="150" cy="120" r="1.2"/><circle cx="680" cy="140" r="1.3"/>
  </g>
  <!-- Salón -->
  <rect x="170" y="250" width="460" height="230" rx="8" fill="#2E0A14" stroke="#B99B5F" stroke-width="2"/>
  <path d="M150 260 L400 160 L650 260 Z" fill="#3A0C1A" stroke="#B99B5F" stroke-width="2"/>
  <g fill="url(#calido)">
    <rect x="210" y="300" width="70" height="120" rx="35"/>
    <rect x="310" y="300" width="70" height="120" rx="35"/>
    <rect x="420" y="300" width="70" height="120" rx="35"/>
    <rect x="520" y="300" width="70" height="120" rx="35"/>
  </g>
  <!-- Guirnaldas de luces -->
  <g fill="none" stroke="#B99B5F" stroke-width="1.6">
    <path d="M40 190 Q210 260 400 220 Q590 180 760 250"/>
  </g>
  <g fill="#F2D8A7">
    <circle cx="120" cy="216" r="4"/><circle cx="220" cy="238" r="4"/><circle cx="320" cy="232" r="4"/>
    <circle cx="420" cy="217" r="4"/><circle cx="520" cy="203" r="4"/><circle cx="620" cy="212" r="4"/>
    <circle cx="710" cy="234" r="4"/>
  </g>
  <!-- Reflejo del salón sobre el pasto -->
  <rect y="480" width="800" height="120" fill="#170509"/>
  <ellipse cx="400" cy="500" rx="260" ry="16" fill="#B9905F" opacity="0.22"/>
</svg>
